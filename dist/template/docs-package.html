<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}} · {{site_title}}</title>
    <link rel="icon" type="image/png" href="{{base}}/favicon.png" />
    <link rel="stylesheet" href="{{base}}/assets/css/scibasic.css" />
    <link rel="stylesheet" href="{{base}}/assets/css/docs.css" />
    <script>try{if(localStorage.getItem('readership.sidebar')==='collapsed'){document.documentElement.classList.add('side-collapsed');}}catch(e){}</script>
</head>

<body data-page="doc">
    <a id="top"></a>

    <header class="topbar">
        <a class="brand" href="{{base}}/index.html">
            <img src="{{base}}/favicon.png" alt="nuget server logo" onerror="this.style.display='none'" />
            <strong>nuget</strong>
            <span class="sub">api documents</span>
        </a>
        <nav class="topnav">
            <a href="{{base}}/index.html">Packages</a>
            <a href="{{base}}/about.html">Statistics</a>
            <a href="{{base}}/graph.html">Graphs</a>
            <a href="{{base}}/docs/index.html" class="on">API Docs</a>
        </nav>
        <div class="topbar-tools">
            <button id="doc-side-toggle" class="home-btn doc-toggle" type="button" title="Hide navigation"
                aria-label="Hide navigation" aria-controls="doc-tree" aria-expanded="true">◧</button>
            <a class="home-btn" href="#top" title="Top" aria-label="Top">↑</a>
        </div>
    </header>

    <div class="doc-shell">
        <aside class="doc-side">{{sidebar}}</aside>
        <main class="doc-main">
            <div class="wrap doc-wrap">
                <p class="eyebrow doc-breadcrumb">{{breadcrumb}}{{version_select}}</p>
                {{content}}
            </div>
        </main>
    </div>

    <footer class="site">
        <div class="pn">
            <a href="{{base}}/docs/index.html"><span>Back</span>Global Index</a>
            <a href="{{base}}/package.html?id={{package_id}}"><span>Package</span>{{package_id}}</a>
        </div>
        <div class="legal">generated by Readership · {{generated}} · {{namespace_count}} namespaces ·
            {{type_count}} types · {{member_count}} members</div>
    </footer>

    <script src="{{base}}/assets/js/docs.js"></script>
</body>

</html>
